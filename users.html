
{% extends "base.html" %}
{% block title %}المستخدمون{% endblock %}
{% block content %}
<div class="page-head"><h1>المستخدمون والرموز</h1><a class="back" href="{{ url_for('home') }}">رجوع</a></div>
<div class="table-wrap"><table>
<thead><tr><th>الرمز</th><th>القسم</th><th>الشفت</th><th>الصلاحية</th><th>الحالة</th></tr></thead>
<tbody>{% for r in rows %}<tr><td>{{ r.code }}</td><td>{{ r.department }}</td><td>{{ r.shift }}</td><td>{{ r.role }}</td><td>{{ 'فعال' if r.active else 'موقوف' }}</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
